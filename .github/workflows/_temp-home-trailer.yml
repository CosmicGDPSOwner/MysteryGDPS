name: Temporary home trailer patch

on:
  push:
    branches: [main]
    paths:
      - '.home-trailer-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch home hero and trailer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_badge = '            <div class="hero-eyebrow">🌙 Private Server</div>\n'
          old_video = 'https://www.youtube.com/embed/26I0Xl9GOUo'
          new_video = 'https://www.youtube.com/embed/dBuMLYkYsQM'
          if old_badge not in s:
              raise SystemExit('hero badge not found')
          if old_video not in s:
              raise SystemExit('old trailer URL not found')
          s = s.replace(old_badge, '', 1)
          s = s.replace(old_video, new_video, 1)
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .home-trailer-trigger .github/workflows/_temp-home-trailer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ui: simplify home hero and update trailer'
          git push origin main
