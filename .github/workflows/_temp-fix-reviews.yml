name: temp fix reviews

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temp-fix-reviews.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove duplicate broken submitReview
        shell: python
        run: |
          from pathlib import Path

          path = Path('assets/js/app.js')
          text = path.read_text(encoding='utf-8')

          marker = '        function submitReview() {'
          positions = []
          start = 0
          while True:
              pos = text.find(marker, start)
              if pos == -1:
                  break
              positions.append(pos)
              start = pos + len(marker)

          if len(positions) != 2:
              raise SystemExit(f'Expected exactly 2 submitReview functions, found {len(positions)}')

          second = positions[1]
          end_marker = '        function renderModList() {'
          end = text.find(end_marker, second)
          if end == -1:
              raise SystemExit('renderModList marker not found after duplicate submitReview')

          removed = text[second:end]
          if 'reviewCaptchaAnswer' not in removed:
              raise SystemExit('Safety check failed: second function is not the known broken duplicate')

          text = text[:second] + text[end:]
          path.write_text(text, encoding='utf-8')

          if text.count(marker) != 1:
              raise SystemExit('Patch failed: submitReview count is not 1')
          if 'reviewCaptchaAnswer' in text:
              raise SystemExit('Patch failed: stale reviewCaptchaAnswer reference still exists')

      - name: Check JavaScript syntax
        run: node --check assets/js/app.js

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/_temp-fix-reviews.yml
          git add assets/js/app.js .github/workflows/_temp-fix-reviews.yml
          git commit -m "Fix review submission handler"
          git push
