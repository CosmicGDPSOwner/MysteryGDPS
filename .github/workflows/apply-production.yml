name: Apply NightGDPS production payload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-production.yml'
      - '.deploy/**'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ hashFiles('.deploy/part00.b64') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore production files
        shell: bash
        run: |
          set -euo pipefail
          cat .deploy/part*.b64 | tr -d '\n' | base64 -d > /tmp/nightgdps.tgz
          echo "d50f01e3e1978ef5da96aec08b59e19697d2e7de8ead649a4b6c8614c1bba4cf  /tmp/nightgdps.tgz" | sha256sum -c -
          tar -xzf /tmp/nightgdps.tgz -C .
          rm -rf .deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: deploy accounts, records, impossible list and Turnstile"
          git push origin HEAD:main
