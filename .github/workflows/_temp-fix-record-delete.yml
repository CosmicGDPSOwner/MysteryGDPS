name: temp fix moderator record delete

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Allow every moderator to delete records only
        shell: python
        run: |
          from pathlib import Path

          path = Path('assets/js/app.js')
          text = path.read_text(encoding='utf-8')

          old_button = '''                            ${isDeleteMode && isAdmin ? `<button style="background:transparent;border:none;color:#ff4d4d;cursor:pointer;font-size:0.9rem;" onclick="deleteVictor('${d.key}','${vk}','${type}')"><i class="fas fa-trash"></i></button>` : ''}'''
          new_button = '''                            ${isModerator && (isEditMode || isDeleteMode) ? `<button style="background:transparent;border:none;color:#ff4d4d;cursor:pointer;font-size:0.9rem;" onclick="deleteVictor('${d.key}','${vk}','${type}')" title="Удалить рекорд"><i class="fas fa-trash"></i></button>` : ''}'''

          old_delete = '''        function deleteVictor(dk, vk, type = 'demons') {
            if(confirm(currentLang==='EN'?"Delete record?":"Удалить рекорд?")) {
                db.ref(`${type}/${dk}/victors/${vk}`).remove().then(() => { 
                    document.getElementById('detailModal').style.display='none'; 
                    showToast('🗑️ Рекорд удален');
                });
            }
        }'''
          new_delete = '''        function deleteVictor(dk, vk, type = 'demons') {
            // Удаление отдельных рекордов доступно всей команде модерации.
            // Это НЕ включает глобальный delete mode и не даёт модераторам удалять уровни/креаторов.
            if (!isModerator) { showToast('Нет доступа!'); return; }
            if(confirm(currentLang==='EN'?"Delete record?":"Удалить рекорд?")) {
                db.ref(`${type}/${dk}/victors/${vk}`).remove().then(() => {
                    document.getElementById('detailModal').style.display='none';
                    showToast('🗑️ Рекорд удален');
                }).catch(e => showToast('Ошибка: ' + e.message));
            }
        }'''

          if text.count(old_button) != 1:
              raise SystemExit(f'Safety check failed: expected 1 old record-delete button condition, found {text.count(old_button)}')
          if text.count(old_delete) != 1:
              raise SystemExit(f'Safety check failed: expected 1 old deleteVictor block, found {text.count(old_delete)}')

          text = text.replace(old_button, new_button, 1)
          text = text.replace(old_delete, new_delete, 1)

          if old_button in text or old_delete in text:
              raise SystemExit('Patch failed: stale record-delete code remains')
          if text.count('function deleteVictor(') != 1:
              raise SystemExit('Patch failed: deleteVictor function count is not 1')
          if 'isModerator && (isEditMode || isDeleteMode)' not in text:
              raise SystemExit('Patch failed: moderator delete button condition missing')
          if "if (!isModerator) { showToast('Нет доступа!'); return; }" not in text:
              raise SystemExit('Patch failed: deleteVictor moderator guard missing')

          path.write_text(text, encoding='utf-8')

      - name: Check JavaScript syntax
        run: node --check assets/js/app.js

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/_temp-fix-record-delete.yml
          git add -A
          git commit -m "Allow moderators to delete records"
          git push origin HEAD:main
