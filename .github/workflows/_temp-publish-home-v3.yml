name: temp publish home v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_temp-publish-home-v3.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply homepage v3 patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/home_v3.patch.gz.b64 <<'EOF'
          
          EOF
          base64 -d /tmp/home_v3.patch.gz.b64 | gzip -d > /tmp/home_v3.patch
          git apply --check /tmp/home_v3.patch
          git apply /tmp/home_v3.patch
          node --check assets/js/app.js
          git diff --check

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/css/styles.css assets/js/app.js
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
            exit 0
          fi
          git commit -m 'ui: refresh homepage and preserve navigation'
          git push origin HEAD:main
