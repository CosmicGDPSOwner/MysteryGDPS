name: Bootstrap split site PR

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  publish-split:
    if: github.event.pull_request.head.ref == 'site-split-redesign'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site-split-redesign
          fetch-depth: 0

      - name: Restore tested site files
        shell: bash
        run: |
          set -euo pipefail
          test -d .site-bootstrap || exit 0
          cat .site-bootstrap/payload-* | base64 -d > /tmp/night-site.tar.gz
          echo "d4c1a25d8c72f841c5c30387491ab925aca39b7420629b65c243e3d3be587265  /tmp/night-site.tar.gz" | sha256sum -c -
          rm -rf assets
          tar -xzf /tmp/night-site.tar.gz
          rm -rf .site-bootstrap
          rm -rf .github
          echo "e614f08d664d56fa2f57c28c92a0ff8e1e58729fe3c92ee2bc425fe248443097  index.html" | sha256sum -c -
          echo "97999341af1d0e961b313f90b43158872de4c0d8bd1155357c8affaaf384b3a6  assets/css/styles.css" | sha256sum -c -
          echo "05ca48431ff80d8df66a9d14a603a70812c7a2c4261d309bf759c8ff8a017c70  assets/js/app.js" | sha256sum -c -

      - name: Commit tested split site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor: split Night GDPS site structure"
          git push origin HEAD:site-split-redesign
