name: temp wire record delete permission

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Add record delete permission controls
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          new_mod_anchor = '''                <label class="perm-check-label">
                    <input type="checkbox" id="permAddRecords" checked>
                    <span><i class="fas fa-medal" style="color:#60a5fa;margin-right:6px;"></i>Заносить рекорды (слееры, креаторы, викторы)</span>
                </label>'''
          new_mod_insert = new_mod_anchor + '''
                <label class="perm-check-label">
                    <input type="checkbox" id="permDeleteRecords" checked>
                    <span><i class="fas fa-trash" style="color:#ff6868;margin-right:6px;"></i>Удалять рекорды</span>
                </label>'''

          edit_anchor = '''            <label class="perm-check-label">
                <input type="checkbox" id="editPermAddRecords">
                <span><i class="fas fa-medal" style="color:#60a5fa;margin-right:6px;"></i>Заносить рекорды</span>
            </label>'''
          edit_insert = edit_anchor + '''
            <label class="perm-check-label">
                <input type="checkbox" id="editPermDeleteRecords">
                <span><i class="fas fa-trash" style="color:#ff6868;margin-right:6px;"></i>Удалять рекорды</span>
            </label>'''

          script_anchor = '''    <script src="./assets/js/app.js"></script>'''
          script_insert = script_anchor + '''
    <script src="./assets/js/record-delete-permission.js"></script>'''

          replacements = [
              ('new moderator permission block', new_mod_anchor, new_mod_insert),
              ('edit permission block', edit_anchor, edit_insert),
              ('permission module script', script_anchor, script_insert),
          ]

          for label, old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Safety check failed for {label}: expected 1 anchor, found {count}')
              text = text.replace(old, new, 1)

          if text.count('id="permDeleteRecords"') != 1:
              raise SystemExit('permDeleteRecords checkbox count is not 1')
          if text.count('id="editPermDeleteRecords"') != 1:
              raise SystemExit('editPermDeleteRecords checkbox count is not 1')
          if text.count('./assets/js/record-delete-permission.js') != 1:
              raise SystemExit('record delete permission script is not connected exactly once')

          path.write_text(text, encoding='utf-8')

      - name: Check JavaScript syntax
        run: node --check assets/js/record-delete-permission.js

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/_temp-enable-record-delete-permission.yml
          git add index.html .github/workflows/_temp-enable-record-delete-permission.yml
          git commit -m "Add moderator record delete checkbox"
          git push origin HEAD:main
